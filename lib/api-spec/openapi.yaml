openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Skillissu - Peer-to-peer skill exchange platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: onboarding
    description: Onboarding flow
  - name: swipe
    description: Swipe/matching system
  - name: matches
    description: Match management
  - name: exchange
    description: Skill exchange system
  - name: credits
    description: Credit system
  - name: gamification
    description: Streaks, badges, XP
  - name: nudges
    description: AI nudge suggestions
  - name: notifications
    description: Push notifications
  - name: analytics
    description: Analytics and stats
  - name: ledger
    description: Exchange ledger
  - name: chat
    description: Chat system
  - name: verification
    description: Skill verification via quiz and documents
  - name: ai
    description: AI-powered coaching and learning paths
  - name: sessions
    description: Video sessions and post-session feedback
  - name: battles
    description: Skill battles - timed head-to-head challenges

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/explore:
    get:
      operationId: getExploreUsers
      tags: [users]
      summary: Get users to explore/swipe
      responses:
        "200":
          description: List of users to explore
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExploreUser"

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      summary: Save onboarding data and mark user as onboarded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingBody"
      responses:
        "200":
          description: Onboarding complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /swipe:
    post:
      operationId: recordSwipe
      tags: [swipe]
      summary: Record a swipe (left or right)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwipeBody"
      responses:
        "200":
          description: Swipe recorded, match info if matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwipeResult"

  /matches:
    get:
      operationId: getMatches
      tags: [matches]
      summary: Get all matches for current user
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /exchange:
    post:
      operationId: createExchange
      tags: [exchange]
      summary: Create a skill exchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExchangeBody"
      responses:
        "200":
          description: Exchange created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exchange"
    get:
      operationId: getExchanges
      tags: [exchange]
      summary: Get recent exchanges for current user
      responses:
        "200":
          description: List of exchanges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exchange"

  /exchange/{exchangeId}/complete:
    post:
      operationId: completeExchange
      tags: [exchange]
      summary: Mark an exchange as complete
      parameters:
        - name: exchangeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exchange completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exchange"

  /credits:
    get:
      operationId: getCreditBalance
      tags: [credits]
      summary: Get credit balance and transaction history
      responses:
        "200":
          description: Credit info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditInfo"

  /gamification/me:
    get:
      operationId: getGamification
      tags: [gamification]
      summary: Get current user gamification data (streaks, badges, XP)
      responses:
        "200":
          description: Gamification data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamificationData"

  /nudges:
    get:
      operationId: getNudges
      tags: [nudges]
      summary: Get AI nudge suggestions for current user
      responses:
        "200":
          description: List of nudges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Nudge"

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get notifications for current user
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /analytics/me:
    get:
      operationId: getMyAnalytics
      tags: [analytics]
      summary: Get analytics for current user
      responses:
        "200":
          description: User analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAnalytics"

  /ledger:
    get:
      operationId: getLedger
      tags: [ledger]
      summary: Get exchange ledger entries
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntry"

  /chat/{matchId}/messages:
    get:
      operationId: getChatMessages
      tags: [chat]
      summary: Get chat messages for a match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a chat message
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  /chat/list:
    get:
      operationId: getChatList
      tags: [chat]
      summary: Get list of all chats (one per match)
      responses:
        "200":
          description: List of chats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSummary"

  /battles:
    get:
      operationId: getBattles
      tags: [battles]
      summary: Get all skill battles for voting feed and history
      responses:
        "200":
          description: List of battles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillBattle"
    post:
      operationId: createBattle
      tags: [battles]
      summary: Create a new skill battle challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBattleBody"
      responses:
        "200":
          description: Battle created with AI-generated questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillBattle"

  /battles/{battleId}/submit:
    post:
      operationId: submitBattleAnswers
      tags: [battles]
      summary: Submit answers for a skill battle
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitBattleBody"
      responses:
        "200":
          description: Battle results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillBattle"

  /battles/{battleId}/vote:
    post:
      operationId: voteOnBattle
      tags: [battles]
      summary: Vote on a completed battle
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteBattleBody"
      responses:
        "200":
          description: Vote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillBattle"

  /skills/demand:
    get:
      operationId: getSkillDemand
      tags: [users]
      summary: Get demand level for all skills based on exchange frequency
      responses:
        "200":
          description: Skill demand map
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillDemandEntry"

  /sessions/start:
    post:
      operationId: startSession
      tags: [sessions]
      summary: Start a new video session for a match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionBody"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{sessionId}/end:
    post:
      operationId: endSession
      tags: [sessions]
      summary: End a video session and trigger credit transfer
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{sessionId}/feedback:
    post:
      operationId: submitSessionFeedback
      tags: [sessions]
      summary: Submit post-session rating and review
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionFeedbackBody"
      responses:
        "200":
          description: Feedback submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success

  /sessions/{sessionId}/notes:
    get:
      operationId: getSessionNotes
      tags: [sessions]
      summary: Get notes and whiteboard for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotes"
    put:
      operationId: saveSessionNotes
      tags: [sessions]
      summary: Save notes and whiteboard strokes for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionNotesBody"
      responses:
        "200":
          description: Notes saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotes"

  /sessions/history:
    get:
      operationId: getSessionHistory
      tags: [sessions]
      summary: Get past sessions for current user
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

  /ai/skill-coach:
    get:
      operationId: getSkillCoach
      tags: [ai]
      summary: Get AI skill coach feedback based on recent exchanges
      responses:
        "200":
          description: Skill coach feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillCoachFeedback"

  /ai/learning-paths:
    get:
      operationId: getLearningPaths
      tags: [ai]
      summary: Get all learning paths for current user
      responses:
        "200":
          description: List of learning paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningPath"
    post:
      operationId: generateLearningPath
      tags: [ai]
      summary: Generate a new AI learning path for a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateLearningPathBody"
      responses:
        "200":
          description: Generated learning path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPath"

  /ai/learning-paths/{pathId}/steps/{stepId}/complete:
    post:
      operationId: completeLearningStep
      tags: [ai]
      summary: Mark a learning path step as complete
      parameters:
        - name: pathId
          in: path
          required: true
          schema:
            type: string
        - name: stepId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated learning path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPath"

  /verification/quiz:
    post:
      operationId: generateQuiz
      tags: [verification]
      summary: Generate a skill verification quiz using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateQuizBody"
      responses:
        "200":
          description: Quiz questions generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"

  /verification/quiz/submit:
    post:
      operationId: submitQuiz
      tags: [verification]
      summary: Submit quiz answers for a skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitQuizBody"
      responses:
        "200":
          description: Quiz result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"

  /verification/upload:
    post:
      operationId: uploadVerificationDoc
      tags: [verification]
      summary: Upload a verification document (mock)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadDocBody"
      responses:
        "200":
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDoc"

  /verification/status:
    get:
      operationId: getVerificationStatus
      tags: [verification]
      summary: Get skill verification status for current user
      responses:
        "200":
          description: Verification status per skill
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillVerification"


  /reels:
    get:
      operationId: getReels
      tags: [reels]
      summary: Get skill reels feed
      responses:
        "200":
          description: List of reels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reel"
    post:
      operationId: createReel
      tags: [reels]
      summary: Create a new reel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReelBody"
      responses:
        "200":
          description: Created reel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reel"

  /reels/{id}/react:
    post:
      operationId: reactToReel
      tags: [reels]
      summary: React to a reel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReelReactionBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /auctions:
    get:
      operationId: getAuctions
      tags: [auctions]
      summary: Get active auctions
      responses:
        "200":
          description: List of auctions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Auction"
    post:
      operationId: createAuction
      tags: [auctions]
      summary: Create an auction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuctionBody"
      responses:
        "200":
          description: Created auction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auction"

  /auctions/{id}/bid:
    post:
      operationId: placeBid
      tags: [auctions]
      summary: Place a bid on an auction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidBody"
      responses:
        "200":
          description: Bid placed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  newBid:
                    type: number
                required: [success, newBid]

  /study-rooms:
    get:
      operationId: getStudyRooms
      tags: [studyRooms]
      summary: Get all study rooms
      responses:
        "200":
          description: List of study rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyRoom"
    post:
      operationId: createStudyRoom
      tags: [studyRooms]
      summary: Create a study room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudyRoomBody"
      responses:
        "200":
          description: Created room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyRoom"

  /study-rooms/{id}/join:
    post:
      operationId: joinStudyRoom
      tags: [studyRooms]
      summary: Join a study room
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /study-rooms/{id}/leave:
    post:
      operationId: leaveStudyRoom
      tags: [studyRooms]
      summary: Leave a study room
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Left
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /study-rooms/{id}/pins:
    get:
      operationId: getStudyRoomPins
      tags: [studyRooms]
      summary: Get pins for a study room
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of pins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyRoomPin"
    post:
      operationId: addStudyRoomPin
      tags: [studyRooms]
      summary: Add a pin to a study room
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPinBody"
      responses:
        "200":
          description: Created pin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyRoomPin"

  /skill-dna:
    get:
      operationId: getSkillDna
      tags: [skillDna]
      summary: Get skill DNA for current user
      responses:
        "200":
          description: Skill DNA data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillDna"

  /challenges/today:
    get:
      operationId: getTodayChallenge
      tags: [challenges]
      summary: Get today's cold-start challenge
      responses:
        "200":
          description: Today's challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"

  /challenges/{id}/complete:
    post:
      operationId: completeChallenge
      tags: [challenges]
      summary: Mark a challenge as completed
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  creditsEarned:
                    type: number
                required: [success, creditsEarned]

  /capsules:
    get:
      operationId: getCapsules
      tags: [capsules]
      summary: Get all skill capsules
      responses:
        "200":
          description: List of capsules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capsule"

  /capsules/{id}/enroll:
    post:
      operationId: enrollInCapsule
      tags: [capsules]
      summary: Enroll in a skill capsule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Enrolled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /capsules/{id}/lessons:
    get:
      operationId: getCapsuleLessons
      tags: [capsules]
      summary: Get lessons for a capsule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lessons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleLessonsResponse"

  /capsules/{id}/lessons/{lessonId}/complete:
    post:
      operationId: completeCapsuleLesson
      tags: [capsules]
      summary: Complete a capsule lesson
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lesson completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  lessonsCompleted:
                    type: number
                required: [success, lessonsCompleted]

  /vouches/user/{userId}:
    get:
      operationId: getVouches
      tags: [vouches]
      summary: Get vouches for a user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of vouches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vouch"

  /vouches:
    post:
      operationId: createVouch
      tags: [vouches]
      summary: Vouch for a user's skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVouchBody"
      responses:
        "200":
          description: Vouch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stakeAmount:
                    type: number
                required: [success, stakeAmount]

  /live-drops:
    get:
      operationId: getLiveDrops
      tags: [liveDrops]
      summary: Get active live drops
      responses:
        "200":
          description: List of live drops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveDrop"
    post:
      operationId: createLiveDrop
      tags: [liveDrops]
      summary: Announce a live drop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLiveDropBody"
      responses:
        "200":
          description: Created live drop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveDrop"

  /wrapped:
    get:
      operationId: getWrapped
      tags: [wrapped]
      summary: Get monthly skill wrapped
      responses:
        "200":
          description: Monthly wrapped data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillWrapped"

