openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Skillissu - Peer-to-peer skill exchange platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: onboarding
    description: Onboarding flow
  - name: swipe
    description: Swipe/matching system
  - name: matches
    description: Match management
  - name: exchange
    description: Skill exchange system
  - name: credits
    description: Credit system
  - name: gamification
    description: Streaks, badges, XP
  - name: nudges
    description: AI nudge suggestions
  - name: notifications
    description: Push notifications
  - name: analytics
    description: Analytics and stats
  - name: ledger
    description: Exchange ledger
  - name: chat
    description: Chat system
  - name: verification
    description: Skill verification via quiz and documents
  - name: ai
    description: AI-powered coaching and learning paths
  - name: sessions
    description: Video sessions and post-session feedback
  - name: battles
    description: Skill battles - timed head-to-head challenges

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/explore:
    get:
      operationId: getExploreUsers
      tags: [users]
      summary: Get users to explore/swipe
      responses:
        "200":
          description: List of users to explore
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExploreUser"

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      summary: Save onboarding data and mark user as onboarded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingBody"
      responses:
        "200":
          description: Onboarding complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /swipe:
    post:
      operationId: recordSwipe
      tags: [swipe]
      summary: Record a swipe (left or right)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwipeBody"
      responses:
        "200":
          description: Swipe recorded, match info if matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwipeResult"

  /matches:
    get:
      operationId: getMatches
      tags: [matches]
      summary: Get all matches for current user
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /exchange:
    post:
      operationId: createExchange
      tags: [exchange]
      summary: Create a skill exchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExchangeBody"
      responses:
        "200":
          description: Exchange created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exchange"
    get:
      operationId: getExchanges
      tags: [exchange]
      summary: Get recent exchanges for current user
      responses:
        "200":
          description: List of exchanges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exchange"

  /exchange/{exchangeId}/complete:
    post:
      operationId: completeExchange
      tags: [exchange]
      summary: Mark an exchange as complete
      parameters:
        - name: exchangeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exchange completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exchange"

  /credits:
    get:
      operationId: getCreditBalance
      tags: [credits]
      summary: Get credit balance and transaction history
      responses:
        "200":
          description: Credit info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditInfo"

  /gamification/me:
    get:
      operationId: getGamification
      tags: [gamification]
      summary: Get current user gamification data (streaks, badges, XP)
      responses:
        "200":
          description: Gamification data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamificationData"

  /nudges:
    get:
      operationId: getNudges
      tags: [nudges]
      summary: Get AI nudge suggestions for current user
      responses:
        "200":
          description: List of nudges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Nudge"

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get notifications for current user
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /analytics/me:
    get:
      operationId: getMyAnalytics
      tags: [analytics]
      summary: Get analytics for current user
      responses:
        "200":
          description: User analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAnalytics"

  /ledger:
    get:
      operationId: getLedger
      tags: [ledger]
      summary: Get exchange ledger entries
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntry"

  /chat/{matchId}/messages:
    get:
      operationId: getChatMessages
      tags: [chat]
      summary: Get chat messages for a match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a chat message
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  /chat/list:
    get:
      operationId: getChatList
      tags: [chat]
      summary: Get list of all chats (one per match)
      responses:
        "200":
          description: List of chats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSummary"

  /battles:
    get:
      operationId: getBattles
      tags: [battles]
      summary: Get all skill battles for voting feed and history
      responses:
        "200":
          description: List of battles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillBattle"
    post:
      operationId: createBattle
      tags: [battles]
      summary: Create a new skill battle challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBattleBody"
      responses:
        "200":
          description: Battle created with AI-generated questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillBattle"

  /battles/{battleId}/submit:
    post:
      operationId: submitBattleAnswers
      tags: [battles]
      summary: Submit answers for a skill battle
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitBattleBody"
      responses:
        "200":
          description: Battle results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillBattle"

  /battles/{battleId}/vote:
    post:
      operationId: voteOnBattle
      tags: [battles]
      summary: Vote on a completed battle
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteBattleBody"
      responses:
        "200":
          description: Vote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillBattle"

  /skills/demand:
    get:
      operationId: getSkillDemand
      tags: [users]
      summary: Get demand level for all skills based on exchange frequency
      responses:
        "200":
          description: Skill demand map
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillDemandEntry"

  /sessions/start:
    post:
      operationId: startSession
      tags: [sessions]
      summary: Start a new video session for a match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionBody"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{sessionId}/end:
    post:
      operationId: endSession
      tags: [sessions]
      summary: End a video session and trigger credit transfer
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{sessionId}/feedback:
    post:
      operationId: submitSessionFeedback
      tags: [sessions]
      summary: Submit post-session rating and review
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionFeedbackBody"
      responses:
        "200":
          description: Feedback submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success

  /sessions/{sessionId}/notes:
    get:
      operationId: getSessionNotes
      tags: [sessions]
      summary: Get notes and whiteboard for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotes"
    put:
      operationId: saveSessionNotes
      tags: [sessions]
      summary: Save notes and whiteboard strokes for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionNotesBody"
      responses:
        "200":
          description: Notes saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotes"

  /sessions/history:
    get:
      operationId: getSessionHistory
      tags: [sessions]
      summary: Get past sessions for current user
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

  /ai/skill-coach:
    get:
      operationId: getSkillCoach
      tags: [ai]
      summary: Get AI skill coach feedback based on recent exchanges
      responses:
        "200":
          description: Skill coach feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillCoachFeedback"

  /ai/learning-paths:
    get:
      operationId: getLearningPaths
      tags: [ai]
      summary: Get all learning paths for current user
      responses:
        "200":
          description: List of learning paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningPath"
    post:
      operationId: generateLearningPath
      tags: [ai]
      summary: Generate a new AI learning path for a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateLearningPathBody"
      responses:
        "200":
          description: Generated learning path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPath"

  /ai/learning-paths/{pathId}/steps/{stepId}/complete:
    post:
      operationId: completeLearningStep
      tags: [ai]
      summary: Mark a learning path step as complete
      parameters:
        - name: pathId
          in: path
          required: true
          schema:
            type: string
        - name: stepId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated learning path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPath"

  /verification/quiz:
    post:
      operationId: generateQuiz
      tags: [verification]
      summary: Generate a skill verification quiz using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateQuizBody"
      responses:
        "200":
          description: Quiz questions generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"

  /verification/quiz/submit:
    post:
      operationId: submitQuiz
      tags: [verification]
      summary: Submit quiz answers for a skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitQuizBody"
      responses:
        "200":
          description: Quiz result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"

  /verification/upload:
    post:
      operationId: uploadVerificationDoc
      tags: [verification]
      summary: Upload a verification document (mock)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadDocBody"
      responses:
        "200":
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDoc"

  /verification/status:
    get:
      operationId: getVerificationStatus
      tags: [verification]
      summary: Get skill verification status for current user
      responses:
        "200":
          description: Verification status per skill
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillVerification"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        avatar:
          type: string
        bio:
          type: string
        skillsOffered:
          type: array
          items:
            type: string
        skillsWanted:
          type: array
          items:
            type: string
        skillTBR:
          type: array
          items:
            type: string
        creditBalance:
          type: number
        credibilityScore:
          type: number
        totalExchanges:
          type: number
        streakDays:
          type: number
        xp:
          type: number
        onboarded:
          type: boolean
        monthlyGoals:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyGoal"
        skillProgress:
          type: array
          items:
            $ref: "#/components/schemas/SkillProgress"
      required:
        - id
        - name
        - email
        - skillsOffered
        - skillsWanted
        - skillTBR
        - creditBalance
        - credibilityScore
        - totalExchanges
        - streakDays
        - xp
        - onboarded
        - monthlyGoals
        - skillProgress

    OnboardingBody:
      type: object
      properties:
        name:
          type: string
        bio:
          type: string
        skillsOffered:
          type: array
          items:
            type: string
        skillsWanted:
          type: array
          items:
            type: string
        availability:
          type: string
        domains:
          type: array
          items:
            type: string
        linkedIn:
          type: string
      required:
        - name
        - skillsOffered
        - skillsWanted

    MonthlyGoal:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        progress:
          type: number
        target:
          type: number
      required:
        - id
        - title
        - progress
        - target

    SkillProgress:
      type: object
      properties:
        id:
          type: string
        skill:
          type: string
        status:
          type: string
          enum: [completed, in_progress, to_start]
        progress:
          type: number
      required:
        - id
        - skill
        - status
        - progress

    ExploreUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        avatar:
          type: string
        skillsOffered:
          type: array
          items:
            type: string
        skillsWanted:
          type: array
          items:
            type: string
        credits:
          type: number
        credibilityScore:
          type: number
        bio:
          type: string
        matchScore:
          type: number
        overlappingSkills:
          type: array
          items:
            type: string
        verificationStatus:
          type: string
          enum: [unverified, partial, fully_verified]
        exchangeCount:
          type: number
        isNew:
          type: boolean
      required:
        - id
        - name
        - skillsOffered
        - skillsWanted
        - credits
        - credibilityScore
        - matchScore
        - overlappingSkills
        - verificationStatus
        - exchangeCount
        - isNew

    SwipeBody:
      type: object
      properties:
        targetUserId:
          type: string
        direction:
          type: string
          enum: [left, right]
      required:
        - targetUserId
        - direction

    SwipeResult:
      type: object
      properties:
        matched:
          type: boolean
        matchId:
          type: string
        matchedUser:
          $ref: "#/components/schemas/ExploreUser"
      required:
        - matched

    Match:
      type: object
      properties:
        id:
          type: string
        matchedUser:
          $ref: "#/components/schemas/ExploreUser"
        createdAt:
          type: string
        overlappingSkills:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, active, completed]
      required:
        - id
        - matchedUser
        - createdAt
        - overlappingSkills
        - status

    CreateExchangeBody:
      type: object
      properties:
        matchId:
          type: string
        teachSkill:
          type: string
        learnSkill:
          type: string
        creditsPerSession:
          type: number
      required:
        - matchId
        - teachSkill
        - learnSkill
        - creditsPerSession

    Exchange:
      type: object
      properties:
        id:
          type: string
        matchId:
          type: string
        partnerName:
          type: string
        partnerAvatar:
          type: string
        teachSkill:
          type: string
        learnSkill:
          type: string
        creditsPerSession:
          type: number
        status:
          type: string
          enum: [pending, active, completed]
        createdAt:
          type: string
      required:
        - id
        - matchId
        - partnerName
        - teachSkill
        - learnSkill
        - creditsPerSession
        - status
        - createdAt

    CreditInfo:
      type: object
      properties:
        balance:
          type: number
        totalEarned:
          type: number
        totalSpent:
          type: number
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/CreditTransaction"
      required:
        - balance
        - totalEarned
        - totalSpent
        - transactions

    CreditTransaction:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [earned, spent]
        amount:
          type: number
        description:
          type: string
        createdAt:
          type: string
      required:
        - id
        - type
        - amount
        - description
        - createdAt

    GamificationData:
      type: object
      properties:
        streakDays:
          type: number
        longestStreak:
          type: number
        xp:
          type: number
        level:
          type: number
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        nextBadge:
          $ref: "#/components/schemas/Badge"
      required:
        - streakDays
        - longestStreak
        - xp
        - level
        - badges

    Badge:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        earned:
          type: boolean
        earnedAt:
          type: string
        progress:
          type: number
        target:
          type: number
      required:
        - id
        - name
        - description
        - icon
        - earned

    Nudge:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [unused_credits, skill_match, streak_reminder, goal_progress, new_match]
        message:
          type: string
        actionLabel:
          type: string
        actionRoute:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
      required:
        - id
        - type
        - message
        - priority

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [match, credit_earned, credit_spent, inactivity, goal_progress]
        tone:
          type: string
          enum: [soft, roast, hype]
        message:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - type
        - tone
        - message
        - read
        - createdAt

    UserAnalytics:
      type: object
      properties:
        totalExchanges:
          type: number
        creditsEarned:
          type: number
        creditsSpent:
          type: number
        skillsLearned:
          type: array
          items:
            type: string
        skillsTaught:
          type: array
          items:
            type: string
        exchangesByMonth:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyExchangeCount"
        topSkills:
          type: array
          items:
            $ref: "#/components/schemas/SkillStat"
      required:
        - totalExchanges
        - creditsEarned
        - creditsSpent
        - skillsLearned
        - skillsTaught
        - exchangesByMonth
        - topSkills

    MonthlyExchangeCount:
      type: object
      properties:
        month:
          type: string
        count:
          type: number
      required:
        - month
        - count

    SkillStat:
      type: object
      properties:
        skill:
          type: string
        count:
          type: number
      required:
        - skill
        - count

    LedgerEntry:
      type: object
      properties:
        id:
          type: string
        eventType:
          type: string
          enum: [MATCH_CREATED, EXCHANGE_COMPLETED, CREDITS_UPDATED]
        description:
          type: string
